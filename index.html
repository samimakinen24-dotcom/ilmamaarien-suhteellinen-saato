function editor(id){const old=st.valves.find(v=>v.id===id)||{},ms=Object.keys(schema),m=old.maker||ms[0],ds=Object.keys(schema[m]||{}),d=old.device||ds[0],ss=Object.keys(schema[m]?.[d]||{}).sort((a,b)=>+a-+b),s=old.size||ss[0],ii=schema[m]?.[d]?.[s]||[],ins=old.install||ii[0];app.innerHTML=head('Venttiilin tiedot',id?'Muokkaa lähtötietoja':'Lisää päätelaite')+`<div class="view"><section class="card"><div class="form"><div class="full"><label>Tila / huone</label><input id="room" value="${old.room||''}"></div><div><label>Valmistaja</label><select id="maker">${options(ms,m)}</select></div><div><label>Päätelaite</label><select id="device">${options(ds,d)}</select></div><div><label>Koko</label><select id="size">${options(ss,s)}</select></div><div><label>Asennustapa</label><select id="install">${options(ii,ins)}</select></div><div class="full"><label>Suunniteltu ilmavirta l/s</label><input id="plan" inputmode="decimal" value="${old.plan??''}"></div></div><div class="check"><input id="isref" type="checkbox" ${old.ref?'checked':''}><label for="isref">Merkitse R-referenssiventtiiliksi</label></div><div id="err" class="err"></div></section><div class="buttons"><button id="back" class="light">← Palaa</button><button id="accept" class="primary">HYVÄKSY</button></div></div>`;function cascade(){const ds=Object.keys(schema[maker.value]||{});device.innerHTML=options(ds,ds.includes(device.value)?device.value:ds[0]);const ss=Object.keys(schema[maker.value]?.[device.value]||{}).sort((a,b)=>+a-+b);size.innerHTML=options(ss,ss.includes(size.value)?size.value:ss[0]);const a=schema[maker.value]?.[device.value]?.[size.value]||[];install.innerHTML=options(a,a.includes(install.value)?install.value:a[0])}maker.onchange=cascade;device.onchange=cascade;size.onchange=cascade;back.onclick=setup;accept.onclick=()=>{const p=num(plan.value);if(!room.value.trim()||!maker.value||!device.value||!size.value||!install.value||!(p>0)){err.textContent='Täytä kaikki lähtötiedot.';return}if(isref.checked)st.valves.forEach(v=>v.ref=false);const v={...old,id:old.id||Date.now(),room:room.value.trim(),maker:maker.value,device:device.value,size:size.value,install:install.value,plan:p,ref:isref.checked};if(id)st.valves[st.valves.findIndex(x=>x.id===id)]=v;else st.valves.push(v);renum();save();st.stage='setup';setup()}}
function recalc(v,verify=false){if(verify){v.finalQ=q(v.k,v.verifyPa);v.finalRatio=rat(v.finalQ,v.plan)}else{v.flow=q(v.k,v.pa);v.ratio=rat(v.flow,v.plan)}}function suggest(v,p,targetRatio,mode='balance'){const b=bestPair(v,p,targetRatio);if(!b)return;v.pendingOpening=b.opening;v.pendingK=b.k;v.suggestedFlow=b.flow;v.suggestedRatio=b.ratio;v.suggestedDiff=b.diff;v.measurePa=p;v.suggestMode=mode;v.pressureLocked=true}
function refCard(v,active){return `<section class="card ref"><div class="room">${v.room}</div><div class="model">${v.device} ${v.size}</div><div class="plan">Suunniteltu ${fmt(v.plan)} l/s</div>${badge(v)}<div class="g2"><div class="field ${active?'edit':''}"><label>Avaus</label>${active?`<select data-refopen="${v.id}">${options(D(v)?.o||[],v.opening)}</select>`:`<div class="value">${v.opening??'–'}</div>`}</div><div class="field"><label>k-arvo</label><div class="value">${fmt(v.k,2)}</div></div></div><div class="g3"><div class="field ${active?'edit':''}"><label>Mitattu Pa</label>${active?`<input data-refpa="${v.id}" inputmode="decimal" value="${Number.isFinite(v.pa)?String(v.pa).replace('.',','):''}" placeholder="Syötä">`:`<div class="value">${fmt(v.pa)}</div>`}</div><div class="field"><label>Mitattu l/s</label><div class="value">${fmt(v.flow)}</div></div><div class="field"><label>Suhde %</label><div class="value">${fmt(v.ratio)}</div></div></div></section>`}
function adjustCard(v,targetRatio,verify=false){const actualRatio=verify?v.finalRatio:v.ratio,actualPa=verify?v.verifyPa:v.pa;const confirmed=Number.isFinite(actualRatio)&&v.opening===v.pendingOpening&&!v.needsPressure;const d=confirmed?Math.abs(actualRatio-targetRatio):v.suggestedDiff,c=stateClass(d),locked=v.pressureLocked&&!v.needsPressure;return `<section class="card ${c}"><div class="room">${v.room}</div><div class="model">${v.device} ${v.size}</div><div class="plan">Suunniteltu ${fmt(v.plan)} l/s</div>${badge(v)}<div class="g3"><div class="field ${!locked?'edit':''}"><label>${v.needsPressure?'PÄIVITÄ Pa':verify?'Tarkistus Pa':'Mitattu Pa'}</label><input data-workpa="${v.id}" inputmode="decimal" value="${Number.isFinite(actualPa)&&!v.needsPressure?String(actualPa).replace('.',','):''}" placeholder="${v.needsPressure?'Syötä uusi Pa':'Syötä'}" ${locked?'disabled':''}></div><div class="field"><label>Ehdotettu avaus</label><div class="value" style="color:#176a88">${v.pendingOpening??'–'}</div></div><div class="field"><label>k-arvo</label><div class="value">${fmt(v.pendingK,2)}</div></div></div><div class="g3"><div class="field"><label>Ehdotettu l/s</label><div class="value">${fmt(v.suggestedFlow)}</div></div><div class="field"><label>${verify?'Ehdotettu %':'Ehdotettu suhde %'}</label><div class="value">${fmt(v.suggestedRatio)}</div></div><div class="field"><label>${verify?'Ero 100 %:iin':'Ero R:ään'}</label><div class="value">${Number.isFinite(v.suggestedDiff)?fmt(v.suggestedDiff)+' %':'–'}</div></div></div><div class="status"><span class="dot"></span>${v.needsPressure?'PÄIVITÄ Pa':confirmed&&d<=5?'Kunnossa':Number.isFinite(v.pendingOpening)&&v.pendingOpening!==v.opening?'Säädä ehdotettuun avaukseen':stateText(d)}</div></section>`}
function oldBalanceCard(v){return `<section class="card" style="border-color:#9aa8b2"><div class="room" style="font-size:14px;padding-right:28px">Suhteellisen säädön tallennetut arvot</div><div class="saved-badge">${v.num}</div><div class="g3"><div class="field"><label>Avaus</label><div class="value">${v.balanceOpening??v.opening??'–'}</div></div><div class="field"><label>k-arvo</label><div class="value">${fmt(v.balanceK??v.k,2)}</div></div><div class="field"><label>Pa</label><div class="value">${fmt(v.balancePa)}</div></div></div><div class="g2"><div class="field"><label>Mitattu l/s</label><div class="value">${fmt(v.balanceFlow)}</div></div><div class="field"><label>Suhde %</label><div class="value">${fmt(v.balanceRatio)}</div></div></div></section>`}
function clearWork(v,verify=false){v.measurePa=NaN;v.pendingOpening=undefined;v.pendingK=NaN;v.suggestedFlow=NaN;v.suggestedRatio=NaN;v.suggestedDiff=NaN;v.needsPressure=false;v.pressureLocked=false;if(verify){v.verifyPa=NaN;v.finalQ=NaN;v.finalRatio=NaN}else{v.pa=NaN;v.flow=NaN;v.ratio=NaN}}
function bindRef(){document.querySelectorAll('[data-refopen]').forEach(e=>e.onchange=()=>{const v=st.valves.find(x=>x.id==e.dataset.refopen);v.opening=num(e.value);v.k=kval(v,v.opening);recalc(v);save();render()});document.querySelectorAll('[data-refpa]').forEach(e=>e.onchange=()=>{const v=st.valves.find(x=>x.id==e.dataset.refpa);v.pa=num(e.value);recalc(v);save();render()})}
function bindWork(v,targetRatio,verify=false){document.querySelectorAll('[data-workpa]').forEach(e=>e.onchange=()=>{if(v.pressureLocked&&!v.needsPressure)return;const p=num(e.value);if(!(p>0))return;if(verify){v.verifyPa=p}else{v.pa=p}v.needsPressure=false;suggest(v,p,targetRatio,verify?'verify':'balance');if(v.opening===v.pendingOpening){v.k=v.pendingK;if(verify){v.finalQ=q(v.k,p);v.finalRatio=rat(v.finalQ,v.plan)}else{v.flow=q(v.k,p);v.ratio=rat(v.flow,v.plan)}}save();render()})}
function balance(){const r=R(),os=others(),v=os[st.current];if(!v){st.stage='final';save();render();return}const matched=Number.isFinite(v.ratio)&&Math.abs(v.ratio-r.ratio)<=5&&!v.needsPressure&&v.opening===v.pendingOpening;const suggestionReady=Number.isFinite(v.pendingOpening)&&v.pendingOpening!==v.opening&&!v.needsPressure;app.innerHTML=head('Suhteellinen säätö',`${v.num} / ${os.length} säädettävä venttiili`)+`<div class="view">${refCard(r,!st.refOK)}${!st.refOK?'<button id="confirmR" class="primary wide">VAHVISTA UUSI PAINE</button>':''}${adjustCard(v,r.ratio,false)}${suggestionReady?'<button id="apply" class="primary wide">AVAUS SÄÄDETTY – PÄIVITÄ Pa</button>':''}<div class="buttons"><button id="back" class="light">← Palaa</button><button id="action" class="primary" ${!matched?'disabled':''}>TALLENNA JA SEURAAVA</button></div>${legend('Poikkeama referenssin suhteesta')}<div id="err" class="err"></div></div>`;bindRef();if(st.refOK)bindWork(v,r.ratio,false);document.getElementById('back').onclick=()=>{st.stage='setup';save();render()};if(!st.refOK)document.getElementById('confirmR').onclick=()=>{recalc(r);if(!Number.isFinite(r.ratio)){document.getElementById('err').textContent='Valitse R:n avaus ja syötä Pa.';return}st.refOK=true;clearWork(v,false);save();render()};if(suggestionReady)document.getElementById('apply').onclick=()=>{v.opening=v.pendingOpening;v.k=v.pendingK;v.needsPressure=true;v.pressureLocked=false;v.pa=NaN;v.flow=NaN;v.ratio=NaN;save();render()};document.getElementById('action').onclick=()=>{if(!matched)return;st.current++;st.refOK=false;if(st.current>=os.length)st.stage='final';save();render()}}
function finalView(){const r=R();r.targetPa=pressure(r.plan,r.k);app.innerHTML=head('Lopullinen referenssipaine','Ennen tarkistuskierrosta')+`<div class="view"><section class="card ref"><div class="room">${r.room}</div><div class="model">${r.device} ${r.size}</div>${badge(r)}<div class="big"><small>Tavoite Pa</small><div class="value">${fmt(r.targetPa)} Pa</div></div><div class="field edit"><label>Mitattu Pa</label><input id="finalPa" inputmode="decimal" value="${Number.isFinite(r.finalPa)?String(r.finalPa).replace('.',','):''}"></div><div class="status">Säädä järjestelmää kohti tavoitepainetta</div></section><div class="buttons"><button id="back" class="light">← Palaa</button><button id="confirm" class="primary">VAHVISTA LOPULLINEN PAINE</button></div><div id="err" class="err"></div></div>`;document.getElementById('back').onclick=()=>{st.stage='balance';st.current=Math.max(0,others().length-1);st.refOK=true;save();render()};document.getElementById('confirm').onclick=()=>{const paInput=document.getElementById('finalPa'),errBox=document.getElementById('err');r.finalPa=num(paInput.value);if(!(r.finalPa>0)){errBox.textContent='Syötä positiivinen Pa.';return}st.stage='verify';st.verify=0;others().forEach(x=>{x.balanceOpening=x.opening;x.balanceK=x.k;x.balancePa=x.pa;x.balanceFlow=x.flow;x.balanceRatio=x.ratio;clearWork(x,true);x.verifyPa=x.balancePa;x.finalQ=x.balanceFlow;x.finalRatio=x.balanceRatio;x.pendingOpening=x.opening;x.pendingK=x.k;x.suggestedFlow=x.balanceFlow;x.suggestedRatio=x.balanceRatio;x.suggestedDiff=Math.abs(x.balanceRatio-100);x.needsPressure=false;x.pressureLocked=true});save();render()}}
function verify(){const os=others(),v=os[st.verify];if(!v){st.stage='summary';save();render();return}const savedOk=Number.isFinite(v.balanceRatio)&&Math.abs(v.balanceRatio-100)<=5&&!v.verifyEdited;const matched=savedOk||(Number.isFinite(v.finalRatio)&&Math.abs(v.finalRatio-100)<=5&&!v.needsPressure&&v.opening===v.pendingOpening);const suggestionReady=!savedOk&&Number.isFinite(v.pendingOpening)&&v.pendingOpening!==v.opening&&!v.needsPressure;app.innerHTML=head('Tarkistusmittaus',`${v.num} Venttiili ${st.verify+1} / ${os.length}`)+`<div class="view">${oldBalanceCard(v)}${savedOk?'':adjustCard(v,100,true)}${suggestionReady?'<div class="err" style="text-align:center">Tulos ei ole 0–5 %:n sisällä. Säädä ehdotettuun avaukseen.</div><button id="apply" class="primary wide">HYVÄKSY AVAUS – PÄIVITÄ Pa</button>':''}<div class="buttons"><button id="back" class="light">← Palaa</button><button id="action" class="primary" ${!matched?'disabled':''}>HYVÄKSY JA SEURAAVA</button></div>${legend('Poikkeama suunnitellusta ilmavirrasta')}<div id="err" class="err"></div></div>`;if(!savedOk)bindWork(v,100,true);document.getElementById('back').onclick=()=>{if(st.verify>0)st.verify--;else st.stage='final';save();render()};if(suggestionReady)document.getElementById('apply').onclick=()=>{v.opening=v.pendingOpening;v.k=v.pendingK;v.needsPressure=true;v.pressureLocked=false;v.verifyEdited=true;v.verifyPa=NaN;v.finalQ=NaN;v.finalRatio=NaN;save();render()};document.getElementById('action').onclick=()=>{if(!matched)return;if(savedOk){v.finalOpening=v.balanceOpening;v.finalK=v.balanceK;v.finalPa=v.balancePa;v.finalQ=v.balanceFlow;v.finalRatio=v.balanceRatio}else{v.finalOpening=v.opening;v.finalK=v.k;v.finalPa=v.verifyPa}st.verify++;save();render()}}
function legend(t){return `<div class="legend"><b>${t}</b><div class="legendrow"><span><i class="green"></i>0–5 %</span><span><i class="yellow"></i>&gt;5–10 %</span><span><i class="red"></i>&gt;10 %</span></div></div>`}function summary(){const r=R(),all=[r,...others()];app.innerHTML=head('Säädön yhteenveto','Lopulliset tarkistusmittaukset')+`<div class="view"><div class="list">${all.map(v=>{const flow=v.ref?q(v.k,v.finalPa):v.finalQ,rr=rat(flow,v.plan),c=v.ref?'ref':stateClass(absdev(rr));return `<section class="card ${c}"><div class="room">${v.room}</div><div class="model">${v.device} ${v.size}</div>${badge(v)}<div class="summary"><div><small>Suunniteltu l/s</small><b>${fmt(v.plan)}</b></div><div><small>Mitattu l/s</small><b>${fmt(flow)}</b></div><div><small>% suunnitellusta</small><b>${fmt(rr)}</b></div></div><div class="status">Avaus ${v.opening??'–'} · k-arvo ${fmt(v.k,2)}${v.ref?` · Pa ${fmt(v.finalPa)}`:''}</div></section>`}).join('')}</div><div class="buttons"><button id="back" class="light">← Palaa</button><button id="newp" class="primary">UUSI KOHDE</button></div><div class="note">Tiedot tallentuvat automaattisesti tälle laitteelle.</div></div>`;document.getElementById('back').onclick=()=>{st.stage='verify';st.verify=Math.max(0,others().length-1);save();render()};document.getElementById('newp').onclick=()=>{if(window.confirm('Aloitetaanko uusi kohde?')){st=fresh();save();render()}}}const HELP=[['Lähtötiedot','Lisää tila, päätelaite, koko ja suunniteltu l/s. Valitse yksi R-referenssiksi.','R → ① → ② → ③'],['R: mittaa Pa','Anna referenssin avaus ja Pa. Appi laskee l/s ja suhde-%. Paina VAHVISTA UUSI PAINE.','R Pa → VAHVISTA'],['Automaattinen avausehdotus','Syötä säädettävän venttiilin Pa kerran. Kenttä lukittuu ja appi ehdottaa MASTER 2.0:sta parhaan avauksen.','Pa → lukitus → paras avaus'],['Säädä ja PÄIVITÄ Pa','Säädä ehdotettuun avaukseen. Vasta AVAUS SÄÄDETTY – PÄIVITÄ Pa avaa kentän uudelle mittaukselle.','Säädä → PÄIVITÄ Pa → uusi Pa'],['Toista tarvittaessa','Uusi Pa lukittuu taas. Toista vain, jos avausta muutetaan uudelleen.','Pa → avaus → PÄIVITÄ Pa'],['Seuraavat venttiilit','Ennen seuraavaa venttiiliä päivitä R:n Pa ja vahvista.','R uusi Pa → ② → ③'],['Lopullinen referenssipaine','Säädä järjestelmää R:n Tavoite Pa:han ja vahvista lopullinen paine.','Tavoite Pa → Mitattu Pa → VAHVISTA'],['Tarkistuskierros','Jos tallennettu tulos on 0–5 %, hyväksy suoraan. Muuten avausehdotus ja Pa-lukitus toimivat samalla tavalla.','0–5 % → HYVÄKSY | >5 % → avaus → PÄIVITÄ Pa'],['Yhteenveto','Näet suunnitellun ja mitatun l/s:n, %, avauksen ja k-arvon.','R + ① + ② + ③ → valmis']];let helpIndex=0,helpTimer=null;function openHelp(){helpIndex=0;renderHelp()}function closeHelp(){if(helpTimer){clearInterval(helpTimer);helpTimer=null}const x=document.getElementById('helpov');if(x)x.remove()}function renderHelp(){let ov=document.getElementById('helpov');if(!ov){ov=document.createElement('div');ov.id='helpov';ov.className='helpov';document.body.appendChild(ov)}const x=HELP[helpIndex];ov.innerHTML=`<div class="helpbox"><div class="helpbar"><b>MASTER 1.8 · käyttöohje</b><button type="button" class="helpclose" id="helpClose">Sulje</button></div><section class="helpstep"><h3>${helpIndex+1}. ${x[0]}</h3><p>${x[1]}</p><div class="helpflow">${x[2].split(' → ').map((z,i)=>`<span class="helppill ${z.includes('PÄIVITÄ')?'helpblue':z.includes('0–5')?'helpgreen':''}">${z}</span>${i<x[2].split(' → ').length-1?'<b>→</b>':''}`).join('')}</div></section><div class="helpcount">Vaihe ${helpIndex+1} / ${HELP.length}</div><div class="helpnav"><button type="button" class="light" id="helpPrev" ${helpIndex===0?'disabled':''}>← Edellinen</button><button type="button" class="primary" id="helpPlay">${helpTimer?'PYSÄYTÄ':'TOISTA'}</button><button type="button" class="primary" id="helpNext">${helpIndex===HELP.length-1?'ALUSTA':'Seuraava →'}</button></div></div>`;document.getElementById('helpClose').onclick=closeHelp;document.getElementById('helpPrev').onclick=()=>{if(helpIndex>0){helpIndex--;renderHelp()}};document.getElementById('helpNext').onclick=()=>{helpIndex=helpIndex===HELP.length-1?0:helpIndex+1;renderHelp()};document.getElementById('helpPlay').onclick=()=>{if(helpTimer){clearInterval(helpTimer);helpTimer=null;renderHelp()}else{helpTimer=setInterval(()=>{helpIndex=helpIndex===HELP.length-1?0:helpIndex+1;renderHelp()},3200);renderHelp()}}}function render(){renum();({setup,balance,final:finalView,verify,summary}[st.stage]||setup)()}render();</script></body></html>
